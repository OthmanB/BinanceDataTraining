# Validation schema for training_config.yaml (Phase 1)

required_sections:
  - data
  - targets
  - preprocessing
  - model
  - training
  - snapshot
  - hyperparameter_optimization
  - mlflow
  - evaluation
  - logging
  - security
  - diagnostics
  - run_mode

sections:
  data:
    type: dict
    required_keys:
      source_type:
        type: string
      connection.database_uri:
        type: string
      connection.table_prefix:
        type: string
      connection.request_timeout_seconds:
        type: integer
      connection.connect_timeout_seconds:
        type: integer
      connection.max_retries:
        type: integer
      connection.retry_backoff_factor:
        type: number
      multi_database.enabled:
        type: boolean
      multi_database.strategy:
        type: string
      multi_database.connections:
        type: list
      asset_pairs.target_asset:
        type: string
      asset_pairs.correlated_assets:
        type: list
      asset_pairs.alignment.method:
        type: string
      asset_pairs.alignment.missing_policy_small:
        type: string
      asset_pairs.alignment.missing_policy_large:
        type: string
      asset_pairs.alignment.large_gap_seconds:
        type: integer
      asset_pairs.alignment.bucket_tolerance_seconds:
        type: number
      asset_pairs.alignment.include_mask_channel:
        type: boolean
      ingestion.chunk_hours:
        type: integer
      ingestion.chunk_delay_seconds:
        type: number
      ingestion.max_concurrent_chunk_fetches:
        type: integer
      time_range.start_date:
        type: string
      time_range.end_date:
        type: string
      time_range.cadence_seconds:
        type: integer
      order_book.depth_levels:
        type: integer
      order_book.representation:
        type: string
      order_book.hybrid.raw_levels:
        type: integer
      order_book.hybrid.aggregated_bins:
        type: integer
      order_book.hybrid.bin_strategy:
        type: string
      order_book.schema.timestamp_column:
        type: string
      order_book.schema.bid_price_column:
        type: string
      order_book.schema.bid_quantity_column:
        type: string
      order_book.schema.ask_price_column:
        type: string
      order_book.schema.ask_quantity_column:
        type: string
      order_book.schema.batch_id_column:
        type: string
      temporal_features.local:
        type: list
      temporal_features.global:
        type: list
      temporal_features.market_session:
        type: dict
        required_keys:
          utc_offset_hours:
            type: integer
          sessions:
            type: list
      validation.check_missing_data:
        type: boolean
      validation.max_gap_seconds:
        type: integer
      validation.fail_on_invalid:
        type: boolean

  targets:
    type: dict
    required_keys:
      prediction_horizon_seconds:
        type: integer
      visible_window_seconds:
        type: integer
      price_classes.definition_type:
        type: string
      price_classes.boundaries:
        type: list
      labeling.scheme:
        type: string
      labeling.use_midpoint:
        type: boolean
      labeling.handle_gaps:
        type: string

  preprocessing:
    type: dict
    required_keys:
      normalization.method:
        type: string
      normalization.per_asset:
        type: boolean
      normalization.fit_on_train_only:
        type: boolean
      feature_engineering.enabled:
        type: boolean
      feature_engineering.order_book_features:
        type: list
      feature_engineering.derived_features:
        type: list
      feature_engineering.momentum_window_seconds:
        type: integer
      feature_engineering.volume_proxy_method:
        type: string
      feature_engineering.edge_decay.enabled:
        type: boolean
      feature_engineering.edge_decay.method:
        type: string
      train_test_split.method:
        type: string
      train_test_split.train_ratio:
        type: number
      train_test_split.validation_ratio:
        type: number
      train_test_split.test_ratio:
        type: number
      class_balancing.enabled:
        type: boolean
      class_balancing.method:
        type: string

  model:
    type: dict
    required_keys:
      framework:
        type: string
      backend:
        type: string
      architecture:
        type: string
      input_representation.strategy:
        type: string
      input_representation.temporal_features.integration_mode:
        type: string
      input_representation.temporal_features.use_local_features:
        type: boolean
      input_representation.temporal_features.use_global_features:
        type: boolean
      cnn.num_layers:
        type: integer
      lstm.units:
        type: integer
      output.type:
        type: string
      output.num_classes:
        type: integer
      output.activation:
        type: string
      compilation.optimizer:
        type: string
      compilation.learning_rate:
        type: number
      compilation.loss:
        type: string

  # Optional keys for model.long_term (TD-019 dual-channel support)
  # These are not required since long_term.enabled defaults to false
  model_long_term:
    type: dict
    optional_keys:
      long_term.enabled:
        type: boolean
      long_term.windows_days:
        type: list
      long_term.resolution_days:
        type: integer
      long_term.features:
        type: list
      long_term.summary_method:
        type: string
      long_term.ewma_halflife_days:
        type: number
      long_term.input_dim:
        type: any
      long_term.dense.layers:
        type: list
      long_term.dense.dropout_rates:
        type: list

  training:
    type: dict
    required_keys:
      epochs:
        type: integer
      batch_size:
        type: integer
      debug_max_samples:
        type: integer
      missing_snapshot_strategy:
        type: string
      callbacks.early_stopping.enabled:
        type: boolean
      callbacks.early_stopping.monitor:
        type: string
      callbacks.early_stopping.patience:
        type: integer
      callbacks.early_stopping.restore_best_weights:
        type: boolean
      callbacks.reduce_lr.enabled:
        type: boolean
      callbacks.reduce_lr.monitor:
        type: string
      callbacks.reduce_lr.factor:
        type: number
      callbacks.reduce_lr.patience:
        type: integer
      callbacks.reduce_lr.min_lr:
        type: number
      class_weights.compute_from_train:
        type: boolean
      sample_weighting.enabled:
        type: boolean
      sample_weighting.method:
        type: string
      sample_weighting.half_life_days:
        type: integer
      sample_weighting.apply_to:
        type: string
      fine_tuning.enabled:
        type: boolean
      fine_tuning.base_model_run_id:
        type: any
      fine_tuning.base_model_stage:
        type: string
      fine_tuning.use_model_registry:
        type: boolean
      fine_tuning.registry_name:
        type: any
      fine_tuning.freeze_layers:
        type: string
      fine_tuning.learning_rate_factor:
        type: number
      dataset_cache.enabled:
        type: boolean
      dataset_cache.directory:
        type: string
      dataset_cache.filename_pattern:
        type: string
      dataset_cache.version:
        type: string

  snapshot:
    type: dict
    required_keys:
      enabled:
        type: boolean
      directory:
        type: string
      root_name:
        type: string
      name:
        type: string
      on_config_mismatch:
        type: string
      max_snapshots:
        type: integer

  hyperparameter_optimization:
    type: dict
    required_keys:
      enabled:
        type: boolean
      framework:
        type: string
      n_trials:
        type: integer
      direction:
        type: string
      metric:
        type: string
      search_space:
        type: dict
      trial_model_logging.enabled:
        type: boolean

  mlflow:
    type: dict
    required_keys:
      tracking_uri:
        type: string
      experiment_name:
        type: string
      local_tmp_dir:
        type: string
      artifact_logging.trained_model:
        type: boolean

  evaluation:
    type: dict
    required_keys:
      metrics:
        type: list
      calibration_analysis.enabled:
        type: boolean
      post_hoc_calibration.enabled:
        type: boolean
      post_hoc_calibration.method:
        type: string
      post_hoc_calibration.fit_on_validation:
        type: boolean
      temporal_degradation.enabled:
        type: boolean
      temporal_degradation.num_windows:
        type: integer
      temporal_degradation.overlap_fraction:
        type: number
      missing_snapshot_strategy:
        type: string
      backtesting.enabled:
        type: boolean
      backtesting.initial_capital:
        type: number
      backtesting.transaction_cost:
        type: number
      backtesting.signal_strategy:
        type: string
      backtesting.signal_threshold:
        type: number
      backtesting.intensity_threshold:
        type: number
      backtesting.position_sizing:
        type: string
      backtesting.max_position_pct:
        type: number

  logging:
    type: dict
    required_keys:
      level:
        type: string
      colored_output:
        type: boolean
      log_function_names:
        type: boolean
      colors.function_names:
        type: string
      colors.parameter_names:
        type: string
      colors.parameter_values:
        type: string
      colors.info:
        type: string
      colors.warning:
        type: string
      colors.error:
        type: string
      colors.debug:
        type: string

  security:
    type: dict
    required_keys:
      environment_variables:
        type: list
      validation.check_env_vars_at_startup:
        type: boolean
      validation.fail_if_missing:
        type: boolean

  diagnostics:
    type: dict
    required_keys:
      enabled:
        type: boolean
      sampling.method:
        type: string
      sampling.num_samples:
        type: integer
      sampling.random_seed:
        type: integer
      spread_checks.suspicious_threshold_pct:
        type: number
      spread_checks.high_spread_threshold_pct:
        type: number
      spread_checks.max_high_spread_fraction:
        type: number
      quantity_checks.enable_negative_checks:
        type: boolean
      quantity_checks.enable_zero_stats:
        type: boolean
      outlier_checks.enabled:
        type: boolean
      outlier_checks.z_score_threshold:
        type: number
      outlier_checks.min_nonzero_points:
        type: integer
      anomaly_export.enabled:
        type: boolean
      anomaly_export.max_samples:
        type: integer
      visualization.enabled:
        type: boolean
      visualization.time_series:
        type: boolean
      visualization.histograms:
        type: boolean
      visualization.histogram_bins:
        type: integer
      visualization.heatmaps.enabled:
        type: boolean
      visualization.heatmaps.types:
        type: list
      visualization.heatmaps.num_time_bins:
        type: integer
      visualization.heatmaps.num_spread_bins:
        type: integer
      visualization.spread_clipping.enabled:
        type: boolean
      visualization.spread_clipping.num_sigma:
        type: number
      visualization.depth_heatmap.enabled:
        type: boolean
      visualization.depth_heatmap.num_price_bins:
        type: integer
      label_checks.enabled:
        type: boolean
      label_checks.num_examples:
        type: integer
      label_checks.max_examples_per_figure:
        type: integer
      gap_checks.enabled:
        type: boolean
      gap_checks.large_gap_multiplier:
        type: number
      gap_checks.very_large_gap_multiplier:
        type: number

  run_mode:
    type: dict
    required_keys:
      mode:
        type: string
