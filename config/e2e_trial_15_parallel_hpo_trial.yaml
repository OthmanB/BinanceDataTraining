base_config: "training_config.yaml"

run_mode:
  mode: "trial"

data:
  time_range:
    start_date: "2024-01-01"
    end_date: "2024-01-06"
  asset_pairs:
    correlated_assets: []
  validation:
    fail_on_invalid: false
    max_gap_seconds: 600

training:
  epochs: 2
  batch_size: 24
  debug_max_samples: 100000
  runtime:
    device: "gpu"
    gpu_visible_devices: null
    gpu_memory_growth: false
    gpu_allocator: "default"
    gpu_init_lock_enabled: false
    gpu_init_stagger_seconds: 0
  sequential_training:
    enabled: true
    window_days: 5
    cleanup_completed_windows: false
    cleanup_keep_last_windows: 0
    resume_enabled: false

hyperparameter_optimization:
  enabled: true
  framework: "optuna"
  n_trials: 6
  direction: "minimize"
  metric: "loss"
  trial_model_logging:
    enabled: false
  parallel:
    enabled: true
    resources: ["gpu:0", "gpu:1"]
    storage_uri: null
    study_name: "e2e_trial_15_parallel_hpo"
  regime:
    enabled: true
    retry_on_oom: true
    max_retry_attempts: 3
    batch_backoff_factor: 0.6
    min_batch_size: 8
    failure_policy: "prune"
    failure_penalty_value: 1000000.0
    max_vram_fraction: 0.93
    vram_penalty_weight: 5.0
    low_utilization_penalty:
      enabled: false
      min_samples_per_second: 0.0
      weight: 0.0
    safe_envelope:
      enabled: true
      min_success_trials: 2
      headroom_fraction: 0.95
      persistence_enabled: true
  search_space:
    cnn_filters_1: [32, 64]
    cnn_filters_2: [64, 128]
    lstm_units: [64, 96]
    learning_rate: [0.0005, 0.001]
    batch_size: [16, 24]

snapshot:
  enabled: true
  root_name: "e2e_trials_v2"
  name: "trial_15_parallel_hpo_trial"

evaluation:
  calibration_analysis:
    enabled: false
  post_hoc_calibration:
    enabled: false
  temporal_degradation:
    enabled: false
  backtesting:
    enabled: false

mlflow:
  artifact_logging:
    trained_model: false
  model_registry:
    register_model: false

diagnostics:
  enabled: false
