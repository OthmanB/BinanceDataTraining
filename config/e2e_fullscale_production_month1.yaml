base_config: "training_config_default.yaml"

run_mode:
  mode: "production"

data:
  time_range:
    start_date: "2024-01-01"
    end_date: "2024-02-01"
  asset_pairs:
    alignment:
      missing_policy: "forward_fill"
  asset_pairs:
    target_asset: "BTCUSDT"
    correlated_assets: ["ETHUSDT"]
  validation:
    fail_on_invalid: false

model:
  long_term:
    enabled: true
    windows_days: [3, 7]

training:
  epochs: 10
  batch_size: 12
  debug_max_samples: 100000000
  runtime:
    device: "gpu"
    gpu_visible_devices: null
    gpu_memory_growth: false
    gpu_allocator: "default"
    gpu_init_lock_enabled: false
    gpu_init_stagger_seconds: 0
    mixed_precision: "float16"
    distributed:
      enabled: true
      strategy: "mirrored"
      resources: ["gpu:0", "gpu:1"]
  sequential_training:
    enabled: true
    window_days: 7
    cleanup_completed_windows: false
    cleanup_keep_last_windows: 0
    resume_enabled: true
  sample_weighting:
    enabled: true
    method: "exponential_decay"
    half_life_days: 90
    apply_to: "loss_function"
  fine_tuning:
    enabled: false

hyperparameter_optimization:
  enabled: true
  framework: "optuna"
  n_trials: 6
  direction: "minimize"
  metric: "loss"
  trial_model_logging:
    enabled: false
  parallel:
    enabled: true
    max_trials_per_worker_process: 1
    resources: ["gpu:0", "gpu:1"]
    storage_uri: "sqlite:////home/obenomar/Trade/BinanceAlgo/BinanceDataTraining/tmp/mlflow/optuna/fullscale_month1.db"
    study_name: "e2e_fullscale_production_month1"
  regime:
    enabled: true
    retry_on_oom: true
    max_retry_attempts: 2
    batch_backoff_factor: 0.6
    min_batch_size: 4
    failure_policy: "prune"
    failure_penalty_value: 1000000.0
    max_vram_fraction: 0.93
    vram_penalty_weight: 5.0
    low_utilization_penalty:
      enabled: false
      min_samples_per_second: 0.0
      weight: 0.0
    safe_envelope:
      enabled: true
      min_success_trials: 2
      headroom_fraction: 1.0
      persistence_enabled: true

snapshot:
  enabled: true
  root_name: "e2e_trials_v2"
  name: "fullscale_production_month1"

evaluation:
  calibration_analysis:
    enabled: true
  post_hoc_calibration:
    enabled: true
    method: "temperature_scaling"
    fit_on_validation: true
    min_samples: 500
    temperature_bounds:
      min: 0.1
      max: 10.0
  temporal_degradation:
    enabled: true
    num_windows: 5
    overlap_fraction: 0.0
    log_per_window_metrics: true
  backtesting:
    enabled: false

diagnostics:
  enabled: true
  visualization:
    enabled: true
    time_series: true
    histograms: true
    heatmaps:
      enabled: true
  label_checks:
    enabled: true
  gap_checks:
    enabled: true
