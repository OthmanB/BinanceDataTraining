base_config: "e2e_fullscale_production_month1.yaml"

run_mode:
  mode: "production"

data:
  time_range:
    start_date: "2024-01-01"
    end_date: "2024-01-02"
  asset_pairs:
    alignment:
      missing_policy: "forward_fill"
  validation:
    fail_on_invalid: false

training:
  epochs: 2
  debug_max_samples: 100000000
  sequential_training:
    enabled: true
    window_days: 2
    cleanup_completed_windows: false
    cleanup_keep_last_windows: 0
    resume_enabled: true
#  runtime:
#    gpu_memory_growth: true
#    gpu_allocator: "cuda_malloc_async"

diagnostics:
  execution_mode: "per_snapshot"

hyperparameter_optimization:
  n_trials: 2
  parallel:
    #resources: ["gpu:0"]
    max_trials_per_worker_process: 1
    storage_uri: "sqlite:////home/obenomar/Trade/BinanceAlgo/BinanceDataTraining/tmp/mlflow/optuna/fullscale_preflight_short.db"
    study_name: "e2e_fullscale_preflight_short"
    #study_name: "exp2_allocator_growth"
    #storage_uri: "sqlite:////home/obenomar/Trade/BinanceAlgo/BinanceDataTraining/tmp/mlflow/optuna/exp2_allocator_growth.db"
    #study_name: "exp4_batch"
    #storage_uri: "sqlite:////home/obenomar/Trade/BinanceAlgo/BinanceDataTraining/tmp/mlflow/optuna/exp4_batch.db"
    resume_study: false
  search_space:
    batch_size: [8,16]

